# ═══════════════════════════════════════════════════════════════════════════
#  ~/.tmux.conf — portable (host Wayland, VMs X11, WSL2, servidores SSH)
#  Recomendado tmux >= 3.2. En versiones 2.4–3.1 funciona con funciones
#  reducidas (sin copy-command: el ratón solo copia al buffer de tmux).
#
#  Portapapeles: dos canales simultáneos
#    1) OSC 52: la terminal recibe la copia. Único canal que atraviesa SSH.
#    2) ~/.local/bin/clip-copy: herramienta local (wl-copy, xclip, clip.exe).
#       Cubre terminales sin OSC 52 (VTE: GNOME Terminal, Xfce Terminal).
#  Si falta el script, sigue funcionando OSC 52 (degrada sin errores).
# ═══════════════════════════════════════════════════════════════════════════


# ─── General ────────────────────────────────────────────────────────────────

# ms de espera tras ESC antes de interpretarlo como tecla suelta
# (evita el lag perceptible al salir de modos en vim/nvim)
set -sg escape-time 10

# líneas de scrollback por panel
# (solo afecta a paneles creados después de cargar este valor)
set -g history-limit 50000

# habilita ratón: click para seleccionar panel, arrastre para
# redimensionar, rueda para hacer scroll
# (Shift + arrastre = selección nativa de la terminal, sin pasar por tmux)
set -g mouse on

# las ventanas empiezan a numerarse en 1, no en 0
set -g base-index 1

# los paneles empiezan a numerarse en 1, no en 0
setw -g pane-base-index 1

# al cerrar una ventana intermedia, renumera las restantes
set -g renumber-windows on

# reenvía eventos de foco a los programas internos (autoread de nvim, etc.)
# (-q: ignora la línea en versiones que no la conozcan)
set -gq focus-events on


# ─── Terminal ───────────────────────────────────────────────────────────────

# $TERM interno: tmux-256color si existe su terminfo en este equipo;
# si no (servidores antiguos), screen-256color evita "missing terminal"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Truecolor (24 bits). Dos mecanismos para cubrir todas las versiones:
#  - terminal-overrides ",*:Tc": válido en tmux < 3.2
#  - terminal-features ":RGB":   forma moderna (tmux >= 3.2)
# Windows Terminal, Konsole, GNOME Terminal y Xfce Terminal anuncian xterm*.
set -as terminal-overrides ',xterm*:Tc,wezterm:Tc,ghostty:Tc,kitty:Tc'
set -asq terminal-features ',xterm*:RGB,wezterm:RGB,ghostty:RGB,kitty:RGB'

# permite que secuencias de escape (imágenes tipo kitty icat,
# hyperlinks OSC8) atraviesen tmux sin ser filtradas (tmux >= 3.3)
set -gq allow-passthrough on


# ─── Portapapeles ───────────────────────────────────────────────────────────

# OSC 52 hacia la terminal, también desde programas internos (nvim, o un
# tmux remoto por SSH). "external" descartaría esos últimos y rompería
# SSH + tmux anidado.
# Coste de seguridad: cualquier proceso del panel puede ESCRIBIR en tu
# portapapeles (nunca leerlo).
set -g set-clipboard on

# Declara capacidad de portapapeles (OSC 52) para CUALQUIER $TERM.
# Sin esto, tmux no emite OSC 52 si el $TERM no empieza por "xterm"
# (foot, alacritty, screen*, anidado...).
set -asq terminal-features ',*:clipboard'

# Equivalente para tmux < 3.2: define la capacidad Ms a mano
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Herramienta local usada por los comandos copy-pipe sin argumento:
# doble clic, triple clic y fin de arrastre (tmux >= 3.2; -q lo ignora antes)
set -gq copy-command '~/.local/bin/clip-copy'

# Variables que el script necesita al (re)conectar. Con -ga se AÑADEN a las
# de por defecto (DISPLAY, XAUTHORITY, SSH_AUTH_SOCK, SSH_CONNECTION...);
# sin XAUTHORITY, xclip falla tras relogear en X11.
set -ga update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR WSL_INTEROP WSL_DISTRO_NAME'


# ─── Modo copia (estilo Vim) ────────────────────────────────────────────────

# teclas de vi en copy-mode (explícito, sin depender de $EDITOR/$VISUAL)
setw -g mode-keys vi

# teclas de vi también en la línea de comandos de tmux (prefix + :)
set -g status-keys vi

# v: empezar selección  |  Ctrl+v: alternar selección rectangular
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# y: copiar selección (buffer tmux + OSC 52 + script local) y salir
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.local/bin/clip-copy"

# Soltar el ratón tras arrastrar: mismo comportamiento que y
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/clip-copy"

# Navegación (valores por defecto de copy-mode-vi, solo referencia):
#   g / G        principio / final del historial
#   Ctrl+u / d   media página arriba / abajo
#   Ctrl+b / f   página arriba / abajo
#   / y ?        buscar hacia delante / hacia atrás;  n / N siguiente / anterior

# Y (dentro de copy-mode): copia TODO el historial del panel sin moverte
# (si la terminal trunca el OSC 52 de un historial enorme, ver notas)
bind -T copy-mode-vi Y \
  send -X history-top \; \
  send -X begin-selection \; \
  send -X history-bottom \; \
  send -X end-of-line \; \
  send -X copy-pipe-and-cancel "~/.local/bin/clip-copy"

# prefix + y (fuera de copy-mode): lo mismo, entrando y saliendo solo
bind y \
  copy-mode \; \
  send -X history-top \; \
  send -X begin-selection \; \
  send -X history-bottom \; \
  send -X end-of-line \; \
  send -X copy-pipe-and-cancel "~/.local/bin/clip-copy" \; \
  display-message "Scrollback copiado"

# Pegar: el pegado del SISTEMA es de la terminal (Ctrl+Shift+V; Ctrl+V en
# Windows Terminal). prefix + ] pega solo el buffer interno de tmux.


# ─── Status bar ─────────────────────────────────────────────────────────────

# color de fondo y texto base de toda la barra de estado
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# lado izquierdo: nombre de la sesión activa
set -g status-left " [#S] "

# estilo del bloque status-left
set -g status-left-style "bg=#313244,fg=#89b4fa,bold"

# lado derecho: hostname (útil al correr tmux en distintas máquinas);
# valor estático durante la sesión, por eso no requiere status-interval
set -g status-right " #h "

# estilo del bloque status-right
set -g status-right-style "bg=#313244,fg=#a6e3a1"

# ancho reservado en caracteres para status-left
set -g status-left-length 20

# ancho reservado en caracteres para status-right
set -g status-right-length 25

# alineación del listado de ventanas dentro de la barra
set -g status-justify centre

# formato de cada ventana inactiva en el listado (índice:nombre)
setw -g window-status-format "  #I:#W  "

# formato de la ventana activa: indicador (●) además del cambio de color
setw -g window-status-current-format " ●#I:#W "

# color de texto de las ventanas inactivas
setw -g window-status-style "fg=#585b70"

# estilo de la ventana activa, para destacarla del resto
setw -g window-status-current-style "bg=#313244,fg=#cba6f7,bold"


# ─── Panes ──────────────────────────────────────────────────────────────────

# color del borde de los paneles inactivos
set -g pane-border-style "fg=#313244"

# color del borde del panel activo (el que tiene el foco)
set -g pane-active-border-style "fg=#cba6f7"


# ─── Messages ───────────────────────────────────────────────────────────────

# estilo de los mensajes de tmux (ej. al renombrar ventana con prefix+,)
set -g message-style "bg=#313244,fg=#fab387,bold"

# estilo de resaltado en modo copia (selección de texto)
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
