# ═══════════════════════════════════════════════════════════════════════════
#  ~/.tmux.conf — portable (host Wayland, VMs X11, WSL2, servidores SSH)
#  Recomendado tmux >= 3.2. Sin dependencias externas.
#
#  Portapapeles: dos canales simultáneos
#    1) OSC 52: la terminal recibe la copia. Único canal que atraviesa SSH.
#    2) Comando local embebido (wl-copy, xclip, xsel, clip.exe, termux).
#       Cubre terminales sin OSC 52 (VTE: GNOME Terminal, Xfce Terminal).
#       Requiere la herramienta instalada en el sistema; si no hay ninguna,
#       sigue funcionando OSC 52.
# ═══════════════════════════════════════════════════════════════════════════


# ─── General ────────────────────────────────────────────────────────────────

# espera tras ESC (ms); evita lag al salir de modos en vim/nvim
set -sg escape-time 10

# scrollback por panel (solo afecta a paneles creados después)
set -g history-limit 50000

# ratón: seleccionar panel, redimensionar, scroll
# (Shift + arrastre = selección nativa de la terminal, sin pasar por tmux)
set -g mouse on

# ventanas y paneles numerados desde 1; renumera al cerrar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# reenvía eventos de foco a los programas internos (autoread de nvim, etc.)
set -gq focus-events on


# ─── Terminal ───────────────────────────────────────────────────────────────

# tmux-256color si existe su terminfo; si no, screen-256color
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Truecolor: terminal-overrides para tmux < 3.2, terminal-features para >= 3.2
# (Windows Terminal, Konsole, GNOME Terminal y Xfce Terminal anuncian xterm*)
set -as terminal-overrides ',xterm*:Tc,wezterm:Tc,ghostty:Tc,kitty:Tc'
set -asq terminal-features ',xterm*:RGB,wezterm:RGB,ghostty:RGB,kitty:RGB'

# deja pasar secuencias de escape (imágenes kitty, hyperlinks OSC 8)
# (tmux >= 3.3)
set -gq allow-passthrough on


# ─── Portapapeles ───────────────────────────────────────────────────────────

# OSC 52 hacia la terminal, también desde programas internos (nvim, tmux
# remoto por SSH). "external" rompería SSH + tmux anidado.
# Coste de seguridad: cualquier proceso del panel puede ESCRIBIR en tu
# portapapeles (nunca leerlo).
set -g set-clipboard on

# Declara OSC 52 para cualquier $TERM; sin esto, tmux no lo emite si el
# $TERM no empieza por "xterm" (foot, alacritty, screen*, anidado...)
set -asq terminal-features ',*:clipboard'

# Equivalente para tmux < 3.2
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Comando local de copia (POSIX sh, sin comillas simples dentro).
# Orden: WSL2 -> Wayland -> X11 (xclip, xsel) -> Termux -> nada (SSH).
# La variable solo existe mientras se parsea este archivo.
CLIP_SH='if [ -n "$WSL_DISTRO_NAME" ] && command -v clip.exe >/dev/null 2>&1; then iconv -f UTF-8 -t UTF-16LE | clip.exe; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then exec wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then exec xclip -selection clipboard -in; elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then exec xsel --clipboard --input; elif command -v termux-clipboard-set >/dev/null 2>&1; then exec termux-clipboard-set; else cat >/dev/null; fi'

# Usado por copy-pipe sin argumento: doble clic, triple clic, fin de arrastre
# (tmux >= 3.2). "sh -c" fuerza sintaxis POSIX aunque default-shell sea fish.
set -gq copy-command "sh -c '$CLIP_SH'"

# Variables que el comando necesita al (re)conectar; se AÑADEN a las de por
# defecto (DISPLAY, XAUTHORITY, SSH_AUTH_SOCK...). Sin XAUTHORITY, xclip
# falla tras relogear en X11.
set -ga update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR WSL_INTEROP WSL_DISTRO_NAME'


# ─── Modo copia (estilo Vim) ────────────────────────────────────────────────

setw -g mode-keys vi
set -g status-keys vi

# v: empezar selección  |  Ctrl+v: selección rectangular
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# y o soltar el ratón tras arrastrar: copiar (buffer tmux + OSC 52 + local)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh -c '$CLIP_SH'"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh -c '$CLIP_SH'"

# Y: copia TODO el historial del panel (un historial enorme puede truncarse
# en OSC 52 según la terminal)
bind -T copy-mode-vi Y \
  send -X history-top \; \
  send -X begin-selection \; \
  send -X history-bottom \; \
  send -X end-of-line \; \
  send -X copy-pipe-and-cancel "sh -c '$CLIP_SH'"

# prefix + y: lo mismo, desde fuera de copy-mode
bind y \
  copy-mode \; \
  send -X history-top \; \
  send -X begin-selection \; \
  send -X history-bottom \; \
  send -X end-of-line \; \
  send -X copy-pipe-and-cancel "sh -c '$CLIP_SH'" \; \
  display-message "Scrollback copiado"

# Pegar: Ctrl+Shift+V (Ctrl+V en Windows Terminal) lo gestiona la terminal;
# prefix + ] pega solo el buffer interno de tmux.

# La variable ya está expandida en los bindings; se retira del entorno global
set-environment -gu CLIP_SH


# ─── Status bar ─────────────────────────────────────────────────────────────

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-justify centre

set -g status-left " [#S] "
set -g status-left-style "bg=#313244,fg=#89b4fa,bold"
set -g status-left-length 20

# hostname: útil al usar tmux en varias máquinas
set -g status-right " #h "
set -g status-right-style "bg=#313244,fg=#a6e3a1"
set -g status-right-length 25

setw -g window-status-format "  #I:#W  "
setw -g window-status-style "fg=#585b70"
setw -g window-status-current-format " ●#I:#W "
setw -g window-status-current-style "bg=#313244,fg=#cba6f7,bold"


# ─── Paneles y mensajes ─────────────────────────────────────────────────────

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#fab387,bold"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
