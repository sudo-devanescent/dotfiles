# ─── General ────────────────────────────────────────────────────────────────                      
# ms de espera tras ESC antes de interpretarlo como tecla suelta
# (evita el lag perceptible al salir de modos en vim/nvim)                                          set -g escape-time 10

# líneas de scrollback por panel                  set -g history-limit 10000

# habilita ratón: click para seleccionar panel, arrastre para                                       # redimensionar, rueda para hacer scroll
set -g mouse on

# las ventanas empiezan a numerarse en 1, no en 0
set -g base-index 1

# los paneles empiezan a numerarse en 1, no en 0
setw -g pane-base-index 1

# al cerrar una ventana intermedia, renumera las restantes
# para no dejar huecos en la secuencia
set -g renumber-windows on

# $TERM que tmux reporta a los programas internos;
# valor recomendado actualmente por la documentación de tmux
set -g default-terminal "tmux-256color"

# fuerza truecolor (24-bit) explícito para estas terminales,
# como refuerzo por si el terminfo no se negocia bien solo
set -as terminal-overrides ",xterm*:Tc,ghostty:Tc,kitty:Tc"

# permite que secuencias de escape (protocolos de imagen tipo
# kitty icat, hyperlinks OSC8) atraviesen tmux sin ser filtradas
set -g allow-passthrough on


# ─── Status bar ─────────────────────────────────────────────

# color de fondo y texto base de toda la barra de estado
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# lado izquierdo: nombre de la sesión activa
set -g status-left " [#S] "

# estilo del bloque status-left
set -g status-left-style "bg=#313244,fg=#89b4fa,bold"

# lado derecho: hostname (útil al correr tmux en distintas
# máquinas/dispositivos — Wezterm, Kitty, Termux); valor estático
# durante la sesión, por eso no requiere status-interval
set -g status-right " #h "

# estilo del bloque status-right
set -g status-right-style "bg=#313244,fg=#a6e3a1"

# ancho reservado en caracteres para status-left
set -g status-left-length 20

# ancho reservado en caracteres para status-right
set -g status-right-length 25

# alineación del listado de ventanas dentro de la barra
set -g status-justify centre

# formato de cada ventana inactiva en el listado (índice:nombre)
setw -g window-status-format "  #I:#W  "

# formato de la ventana activa: indicador visual (●) además
# del cambio de color, para identificarla más rápido de un vistazo
setw -g window-status-current-format " ●#I:#W "

# color de texto de las ventanas inactivas
setw -g window-status-style "fg=#585b70"

# estilo de la ventana activa, para destacarla del resto
setw -g window-status-current-style "bg=#313244,fg=#cba6f7,bold"


# ─── Panes ───────────────────────────────────────────────────

# color del borde de los paneles inactivos
set -g pane-border-style "fg=#313244"

# color del borde del panel activo (el que tiene el foco)
set -g pane-active-border-style "fg=#cba6f7"


# ─── Messages ────────────────────────────────────────────────

# estilo de los mensajes de tmux (ej. al renombrar ventana con prefix+,)
set -g message-style "bg=#313244,fg=#fab387,bold"

# estilo de resaltado en modo copia (selección de texto)
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
